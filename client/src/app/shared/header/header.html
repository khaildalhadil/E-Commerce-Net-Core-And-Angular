
<header class="shadow-md p-3 w-full">
    <div class="flex align-middle items-center justify-between max-w-screen-2xl mx-auto">
        <a routerLink="/">
            <img
                src="logoipsum-338.svg"
                alt="logo"
                class="max-h-16"
                >
        </a>
        <nav class="flex gap-3 my-2 uppercase text-xl">
            <a routerLink="/" routerLinkActive="active-link" [routerLinkActiveOptions]="{exact: true}">Home</a>
            <a routerLink="/upsert" routerLinkActive="active-link">Create</a>
        </nav>

        <div class="flex gap-3 align-middle cursor-pointer items-center">
            <a matBadge="2" matBadgeSize="large" class="custom-badge mt-2">
                <mat-icon>shopping_cart</mat-icon>
            </a>
            @if (accountService.currentUser(); as user) {
                <span class="text-sm font-semibold normal-case">Hi, {{user.displayName}}</span>
                <button mat-stroked-button (click)="logout()">Logout</button>
            } @else {
                <button mat-stroked-button routerLink="/login">Login</button>
                <button mat-stroked-button routerLink="/register">Register</button>
            }
        </div>
    </div>
</header>
