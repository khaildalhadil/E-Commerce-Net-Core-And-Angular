
<div class="max-w-md mx-auto mt-16 px-4">
  <mat-card appearance="outlined" class="p-6">
    <mat-card-content>

      <h1 class="text-2xl font-bold text-center mb-6">Login</h1>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="flex flex-col gap-2">

        <mat-form-field appearance="outline">
          <mat-label>Email</mat-label>
          <input matInput type="email" formControlName="email" autocomplete="email">
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Password</mat-label>
          <input matInput type="password" formControlName="password" autocomplete="current-password">
        </mat-form-field>

        @if (errorMessage) {
          <p class="text-red-600 text-sm mb-2">{{errorMessage}}</p>
        }

        <button mat-flat-button color="primary" type="submit" [disabled]="loginForm.invalid" class="w-full">
          Login
        </button>

      </form>

      <p class="text-center mt-4 text-sm">
        Don't have an account?
        <a routerLink="/register" class="text-blue-700 font-semibold">Register</a>
      </p>

    </mat-card-content>
  </mat-card>
</div>
