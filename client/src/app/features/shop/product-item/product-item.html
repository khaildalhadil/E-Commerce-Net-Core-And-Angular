@if (product; as p) {

	<article
		class="card"
		[class.card--ok]="inStock && !isLowStock"
		[class.card--low]="isLowStock"
		[class.card--sold-out]="!inStock">

		<a class="card__link" [routerLink]="['/product', p.id]">
			<div class="card__tray">
				<img
					class="card__photo"
					[src]="p.pictureUrl"
					[alt]="p.name"
					loading="lazy"
					decoding="async">
			</div>

			<p class="card__brand">{{ p.brand }}</p>
			<h3 class="card__name">{{ p.name }}</h3>
		</a>

		<p class="card__stock">
			<span class="card__led" aria-hidden="true"></span>
			{{ stockLabel }}
		</p>

		<div class="card__footer">
			<app-price [value]="p.price" size="lg" />

			<button
				class="card__add"
				type="button"
				[disabled]="!inStock"
				[attr.aria-label]="'Add ' + p.name + ' to cart'"
				(click)="addToCart()">
				<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
					stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
					<path d="M3 4h2l2.4 11.2a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.6L21 8H6" />
					<circle cx="10" cy="20" r="1" />
					<circle cx="18" cy="20" r="1" />
				</svg>
				Add
			</button>
		</div>

	</article>

}
