
<form 
  [formGroup]="productForm" 
  (ngSubmit)="Save()" 
  class="max-w-2xl mx-auto mt-10 ">



  <div class="card">
    <div class="card-body">
            
      <h2 class="card-title text-3xl justify-center mb-6">
       Add Product Information
      </h2>


      <!-- Name -->
      <div class="form-control">

        <label class="label">
          <span class="label-text font-semibold">
            Product Name
          </span>
        </label>

        <input
          type="text"
          formControlName="name"
          placeholder="Enter product name"
          class="input input-bordered w-full border border-gray-400 p-3 rounded"
        />

      </div>



      <!-- Description -->
      <div class="form-control mt-4">

        <label class="label">
          <span class="label-text font-semibold">
            Description
          </span>
        </label>

        <textarea
          formControlName="description"
          placeholder="Enter description"
          class="textarea textarea-bordered w-full  border border-gray-400 p-3 rounded">
        </textarea>

      </div>



      <!-- Price -->
      <div class="form-control mt-4">

        <label class="label">
          <span class="label-text font-semibold">
            Price
          </span>
        </label>

        <input
          type="number"
          formControlName="price"
          placeholder="Enter price"
          class="input input-bordered w-full border border-gray-400 p-3 rounded"
        />

      </div>



      <!-- Picture URL -->
      <div class="form-control mt-4">

        <label class="label">
          <span class="label-text font-semibold">
            Picture URL
          </span>
        </label>

        <input
          type="text"
          formControlName="pictureUrl"
          placeholder="Enter image URL"
          class="input input-bordered w-full border border-gray-400 p-3 rounded"
        />

      </div>



      <!-- Type -->
      <div class="form-control mt-4">

        <label class="label">
          <span class="label-text font-semibold">
            Type
          </span>
        </label>

        <input
          type="text"
          formControlName="type"
          placeholder="Enter product type"
          class="input input-bordered w-full border border-gray-400 p-3 rounded"
        />

      </div>



      <!-- Brand -->
      <div class="form-control mt-4">

        <label class="label">
          <span class="label-text font-semibold">
            Brand
          </span>
        </label>

        <input
          type="text"
          formControlName="brand"
          placeholder="Enter brand"
          class="input input-bordered w-full border border-gray-400 p-3 rounded"
        />

      </div>



      <!-- Quantity -->
      <div class="form-control mt-4">

        <label class="label">
          <span class="label-text font-semibold">
            Quantity In Stock
          </span>
        </label>

        <input
          type="number"
          formControlName="quantitiyInStock"
          placeholder="Enter quantity"
          class="input input-bordered w-full border border-gray-400 p-3 rounded"
        />

      </div>



      <!-- Buttons -->
      <div class="card-actions justify-end mt-8">

        <!-- <button 
          type="reset" 
          class="btn btn-outline">
          Reset
        </button> -->


        <button 
          type="submit" 
          class="btn btn-primary bg-blue-800 px-3 rounded p-2"
          /* [disabled]="productForm.invalid" */
          >

          <!-- <mat-icon>save</mat-icon> -->
          Save

        </button>

      </div>


    </div>
  </div>

</form>
